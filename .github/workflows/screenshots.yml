# QP-UI-13, ADR-F7 (D-89 a), fase 1: visual captures of every listed screen at 1440, 768 and
# 390 px on the `mock` profile, uploaded as an artifact to compare with the canvas. Evidence only:
# not a required check, not part of `npm run verify`, no baseline and no E2E assertions.
name: screenshots
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run screenshots:typecheck
      # The browsers follow the exact version of @playwright/test in the lockfile.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # Also on a cache hit: it skips the download and installs the system libraries of Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: playwright-output/screenshots/
          if-no-files-found: error
          retention-days: 14
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: playwright-output/test-results/
          retention-days: 7
