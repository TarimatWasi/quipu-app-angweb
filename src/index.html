<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Quipu</title>
    <base href="/" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      /* What shows until the app starts: the bar and the blocks of a page, so the first thing a
         person sees is already the shape of the screen. Angular replaces it when it boots. */
      .boot {
        min-height: 100vh;
        background: var(--quipu-piedra, #eceee9);
      }
      .boot-bar {
        height: 72px;
        background: var(--quipu-obsidiana, #141c18);
      }
      .boot-page {
        display: grid;
        gap: 2rem;
        padding: clamp(2rem, 6vw, 4.5rem) clamp(1rem, 4vw, 3rem);
      }
      .boot-block {
        background: var(--quipu-piedra-oscura, #dfe4dc);
        border-radius: 4px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-block {
          animation: none;
        }
      }
      .boot-title {
        width: 14rem;
        height: 3.5rem;
      }
      .boot-panel {
        height: 152px;
      }
      .boot-list {
        height: 20rem;
      }
      .boot-text {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot" aria-busy="true">
        <div class="boot-bar"></div>
        <div class="boot-page">
          <div class="boot-block boot-title"></div>
          <div class="boot-block boot-panel"></div>
          <div class="boot-block boot-list"></div>
        </div>
        <p class="boot-text" role="status">Preparando conexión segura…</p>
      </div>
    </app-root>
  </body>
</html>
