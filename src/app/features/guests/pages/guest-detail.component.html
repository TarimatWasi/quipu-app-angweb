<app-page-header [heading]="title()" backLink="/admin/guests" backTo="Huéspedes" />

@switch (state()) {
  @case ('loading') {
    <app-skeleton class="state" shape="detail" subject="el huésped" />
  }
  @case ('error') {
    <app-load-error class="state" [message]="loadErrorText" (retry)="retry()" />
  }
  @case ('not-found') {
    <app-empty-state class="state" heading="No encontramos a este huésped.">
      <a emptyAction class="quipu-button quipu-button--secondary" routerLink="/admin/guests"
        >Volver a Huéspedes</a
      >
    </app-empty-state>
  }
  @case ('ready') {
    @if (view(); as v) {
      <app-detail-now-panel
        class="now"
        [panel]="v.panel"
        [busy]="busy()"
        (act)="onPanelAction($event)"
      />
      <div class="layout" [class.single]="v.left === 'none'">
        @switch (v.left) {
          @case ('periods') {
            <app-period-payments [rows]="periodRows()" />
          }
          @case ('stays') {
            <app-guest-stays
              [guestId]="v.guest.id"
              [rows]="stayRows()"
              [canRegister]="v.guest.status === 'ACTIVE'"
            />
          }
          @case ('blocked') {
            <section class="blocked" aria-labelledby="blocked-title">
              <h2 id="blocked-title">{{ blocked().title }}</h2>
              <app-empty-state heading="Primero tiene que activar su cuenta.">
                {{ blocked().text }}
              </app-empty-state>
            </section>
          }
        }
        <aside aria-label="Datos del huésped">
          <app-guest-facts [guest]="v.guest" />
          <app-more-actions [actions]="actions()" [busy]="busy()" (act)="onMoreAction($event)" />
        </aside>
      </div>
    }
  }
}
