<form novalidate (submit)="submit($event)">
  <app-dialog-frame heading="Agregar comprobante">
    <div class="body">
      <p class="lead">Queda como agregado por la administración, con el monto que verificaste.</p>

      <app-form-field fieldId="proof-kind" label="Tipo de comprobante" [group]="true">
        <div class="quipu-segmented">
          <button
            type="button"
            [attr.aria-pressed]="kind() === 'VOUCHER'"
            (click)="choose('VOUCHER')"
          >
            Con voucher
          </button>
          <button type="button" [attr.aria-pressed]="kind() === 'CASH'" (click)="choose('CASH')">
            Efectivo, sin voucher
          </button>
        </div>
      </app-form-field>

      @if (kind() === 'VOUCHER') {
        <app-file-field
          fieldId="proof-file"
          help="JPG, PNG o PDF, hasta 5 MB. Puede ser la foto del recibo que entregaste."
          [fileName]="file()?.name ?? null"
          [error]="fileError()"
          (chosen)="picked($event)"
        />
      } @else {
        <p class="note">
          Anota el efectivo que recibiste. Si luego tienes el recibo, agrégalo como voucher de
          referencia.
        </p>
      }

      <app-form-field
        class="amount"
        fieldId="proof-amount"
        label="Monto verificado"
        [money]="true"
        [help]="help"
        [error]="amountError()"
      >
        <input
          appFieldControl
          class="quipu-input"
          type="text"
          inputmode="decimal"
          aria-required="true"
          [value]="amount()"
          (input)="typed($event.target, 'amount')"
        />
      </app-form-field>

      @if (kind() === 'VOUCHER') {
        <app-form-field fieldId="proof-method" label="Medio de pago (opcional)">
          <input
            appFieldControl
            class="quipu-input"
            type="text"
            maxlength="60"
            placeholder="Por ejemplo, Yape"
            [value]="method()"
            (input)="typed($event.target, 'method')"
          />
          <div class="quipu-segmented" role="group" aria-label="Medios frecuentes">
            @for (shortcut of shortcuts; track shortcut) {
              <button
                type="button"
                [attr.aria-pressed]="method() === shortcut"
                (click)="method.set(shortcut)"
              >
                {{ shortcut }}
              </button>
            }
          </div>
        </app-form-field>
      }
    </div>
    <ng-container dialogActions>
      <button class="quipu-button quipu-button--tertiary" type="button" (click)="cancel()">
        Cancelar
      </button>
      <button class="quipu-button quipu-button--primary" type="submit">Agregar comprobante</button>
    </ng-container>
  </app-dialog-frame>
</form>
