<app-auth-shell>
  @if (code() === null || codeRejected()) {
    <section>
      <h1>Enlace no válido</h1>
      <output class="lead">
        {{ serverError() ?? 'Este enlace no es válido. Pide uno nuevo.' }}
      </output>
      <a class="quipu-button quipu-button--secondary" routerLink="/forgot-password"
        >Pedir un enlace nuevo</a
      >
    </section>
  } @else {
    <form
      [formRoot]="resetForm"
      novalidate
      [attr.aria-describedby]="serverError() ? 'reset-password-error' : null"
    >
      <h1>Elige una contraseña nueva</h1>

      <app-new-password-field [field]="resetForm.newPassword" />

      @if (serverError(); as message) {
        <p id="reset-password-error" class="quipu-alert" tabindex="-1">{{ message }}</p>
      }

      <button
        class="quipu-button quipu-button--primary quipu-button--big"
        type="submit"
        [disabled]="resetForm().submitting()"
      >
        Guardar contraseña
      </button>
    </form>
  }
</app-auth-shell>
