<app-auth-shell>
  <form
    [formRoot]="changeForm"
    novalidate
    [attr.aria-describedby]="serverError() ? 'change-password-error' : null"
  >
    <h1>Cambia tu contraseña</h1>
    <p class="lead">Ingresaste con una contraseña temporal. Elige una nueva para continuar.</p>

    <app-new-password-field [field]="changeForm.newPassword" />

    @if (serverError(); as message) {
      <p id="change-password-error" class="quipu-alert" tabindex="-1">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="changeForm().submitting()">
      Cambiar contraseña
    </button>
    <button mat-stroked-button type="button" [disabled]="leaving()" (click)="leave()">Salir</button>
  </form>
</app-auth-shell>
