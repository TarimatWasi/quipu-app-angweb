<app-auth-shell>
  <form
    [formRoot]="changeForm"
    novalidate
    [attr.aria-describedby]="serverError() ? 'change-password-error' : null"
  >
    <h1>Cambia tu contraseña</h1>
    <p>Ingresaste con una contraseña temporal. Elige una nueva para continuar.</p>

    <mat-form-field>
      <mat-label>Nueva contraseña</mat-label>
      <input
        matInput
        id="new-password"
        type="password"
        autocomplete="new-password"
        aria-required="true"
        [formField]="changeForm.newPassword"
        [attr.aria-invalid]="newPasswordError() ? 'true' : null"
        [attr.aria-describedby]="newPasswordError() ? 'new-password-error' : null"
      />
    </mat-form-field>
    @if (newPasswordError(); as message) {
      <p id="new-password-error" class="error">{{ message }}</p>
    }

    @if (serverError(); as message) {
      <p id="change-password-error" class="error" tabindex="-1">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="changeForm().submitting()">
      Cambiar contraseña
    </button>
    <button mat-stroked-button type="button" [disabled]="leaving()" (click)="leave()">Salir</button>
  </form>
</app-auth-shell>
