<app-auth-shell>
  <form
    [formRoot]="changeForm"
    novalidate
    [attr.aria-describedby]="serverError() ? 'change-password-error' : null"
  >
    <h1>Cambia tu contraseña</h1>
    <p class="lead">Ingresaste con una contraseña temporal. Elige una nueva para continuar.</p>

    <div class="quipu-field">
      <label class="quipu-label" for="new-password">Nueva contraseña</label>
      <div class="quipu-reveal">
        <input
          class="quipu-input"
          id="new-password"
          [type]="revealed() ? 'text' : 'password'"
          autocomplete="new-password"
          aria-required="true"
          [formField]="changeForm.newPassword"
          [attr.aria-invalid]="newPasswordError() ? 'true' : null"
          [attr.aria-describedby]="
            newPasswordError() ? 'new-password-error new-password-help' : 'new-password-help'
          "
        />
        <button
          class="quipu-reveal-toggle"
          type="button"
          aria-controls="new-password"
          [attr.aria-pressed]="revealed()"
          (click)="revealed.set(!revealed())"
        >
          {{ revealed() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (newPasswordError(); as message) {
        <p id="new-password-error" class="quipu-field-error">{{ message }}</p>
      }
      <p id="new-password-help" class="quipu-field-help">Mínimo 8 caracteres.</p>
    </div>

    @if (serverError(); as message) {
      <p id="change-password-error" class="quipu-alert" tabindex="-1">{{ message }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="changeForm().submitting()">
      Cambiar contraseña
    </button>
    <button mat-stroked-button type="button" [disabled]="leaving()" (click)="leave()">Salir</button>
  </form>
</app-auth-shell>
