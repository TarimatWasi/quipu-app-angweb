<app-onboarding-frame step="PERSONAL_DATA" [steps]="steps()" [note]="leaveNote">
  @switch (view().status) {
    @case ('initial-loading') {
      <app-skeleton subject="tu registro"
        ><ng-template appSkeletonContent>
          <div class="blocks">
            <section class="block">
              <h2>Tus datos de contacto</h2>
              <app-skeleton-fields [labels]="['Nombre completo', 'Teléfono', 'Correo']" />
            </section>
            <section class="block">
              <h2>Contacto de emergencia <span class="optional">(opcional)</span></h2>
              <app-skeleton-fields [labels]="['Nombre', 'Parentesco', 'Celular']" />
            </section>
            <app-skeleton-block shape="rectangle" width="12rem" />
          </div> </ng-template
      ></app-skeleton>
    }
    @case ('initial-error') {
      <app-load-error
        class="state"
        [message]="loadErrorText"
        [retrying]="retrying()"
        (retry)="reload()"
      />
    }
    @case ('ready') {
      <form class="form" novalidate [formRoot]="dataForm">
        <app-personal-data-fields
          [form]="dataForm"
          prefix="onboarding"
          [emergencyHint]="emergencyHint"
        />
        @if (generalError(); as message) {
          <p class="quipu-alert" role="alert" tabindex="-1" [id]="errorId">{{ message }}</p>
        }
        <div class="actions">
          <button
            class="quipu-button quipu-button--primary quipu-button--big"
            type="submit"
            [disabled]="saving()"
          >
            {{ saving() ? 'Guardando…' : 'Guardar y continuar' }}
          </button>
          <p class="after">{{ after }}</p>
        </div>
      </form>
    }
  }
</app-onboarding-frame>
