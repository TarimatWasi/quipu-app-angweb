<app-page-header [heading]="title" />

@switch (view().status) {
  @case ('initial-loading') {
    <app-skeleton subject="tu contrato"
      ><ng-template appSkeletonContent>
        <div class="page">
          <section class="block">
            <p class="skeleton-state">
              <app-skeleton-block shape="badge" /><app-skeleton-block
                width="24rem"
                height="1.5rem"
              />
            </p>
          </section>
          <section class="block">
            <h2>Lo que acordaste</h2>
            <app-skeleton-facts
              class="facts"
              [wideFirst]="false"
              [labels]="[
                'Ambiente',
                'Cuota mensual',
                'Día de pago',
                'Días de gracia',
                'Desde',
                'Hasta',
              ]"
            />
          </section>
          <section class="block">
            <h2>El documento</h2>
            <app-skeleton-cards [count]="1" [action]="true" />
          </section>
        </div> </ng-template
    ></app-skeleton>
  }
  @case ('initial-error') {
    @if (none()) {
      <app-empty-state class="state" [heading]="noContractTitle">{{
        noContractText
      }}</app-empty-state>
    } @else {
      <app-load-error
        class="state"
        [message]="loadErrorText"
        [retrying]="retrying()"
        (retry)="reload()"
      />
    }
  }
  @case ('ready') {
    <app-refresh-error [message]="refreshError()" [refreshing]="refreshing()" (retry)="reload()" />
    @if (content(); as c) {
      <div class="page">
        <app-contract-detail [block]="c.current" (open)="open($event, c.current)" />
        @if (c.next; as next) {
          <section aria-labelledby="next-title" class="next">
            <h2 id="next-title">Tu próximo contrato</h2>
            <app-contract-detail
              [block]="next"
              [headings]="false"
              openLabel="Ver próximo contrato"
              (open)="open($event, next)"
            />
          </section>
        }
      </div>
    }
  }
}
