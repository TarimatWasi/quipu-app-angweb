<app-page-header heading="Historial de pagos" />

@switch (phase()) {
  @case ('loading') {
    <section class="all" aria-labelledby="history-loading-title">
      <h2 id="history-loading-title" class="cdk-visually-hidden">Tus pagos</h2>
      <ng-template #filtersSkeleton>
        <app-list-filters-skeleton [views]="[]" [fields]="['Estado']" />
      </ng-template>
      <app-payment-history-table
        [loading]="true"
        [rows]="[]"
        [sort]="sort()"
        [skeletonBefore]="filtersSkeleton"
      />
    </section>
  }
  @case ('error') {
    <app-load-error
      class="state"
      [message]="loadErrorText"
      [retrying]="retrying()"
      (retry)="retry()"
    />
  }
  @case ('ready') {
    @if (credit(); as heading) {
      <app-page-notice class="now" [heading]="heading"
        ><a routerLink="/home">Ver estado de cuenta</a></app-page-notice
      >
    }
    <section class="all" aria-labelledby="history-title">
      <h2 id="history-title" class="cdk-visually-hidden">Tus pagos</h2>
      <app-list-filters
        idPrefix="history"
        [searchable]="false"
        [count]="count()"
        [filtered]="filtered()"
        [phoneSorts]="phoneSorts"
        [sortKey]="sort().key"
        (clear)="clearFilters()"
        (phoneSort)="sortOnPhone($event)"
      >
        <app-form-field fieldId="history-state" label="Estado">
          <select
            appFieldControl
            class="quipu-input quipu-input--filter"
            [formField]="filterForm.state"
          >
            @for (option of stateOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </app-form-field>
      </app-list-filters>

      <app-list-results
        [shown]="rows().length"
        [loaded]="loadedCount()"
        [filtered]="filtered()"
        [noMatchHeading]="noMatchHeading"
        [empty]="empty"
        [errorText]="loadErrorText"
        [listFailed]="listFailed()"
        [moreFailed]="moreFailed()"
        [retrying]="retrying()"
        [hasMore]="nextCursor() !== null"
        [loadingMore]="loadingMore()"
        (retry)="retry()"
        (clearFilters)="clearFilters()"
        (more)="more()"
      >
        <a emptyAction class="quipu-button quipu-button--primary" routerLink="/guest/payments/new"
          >Subir voucher</a
        >
        <app-payment-history-table [rows]="rows()" [sort]="sort()" (sortBy)="sortBy($event)" />
      </app-list-results>
    </section>
  }
}
