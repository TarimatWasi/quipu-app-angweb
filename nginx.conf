# Servidor estático del frontend. El enrutado de /bff lo hace la capa de alojamiento (Vercel u otro
# proxy), no esta imagen.
map $uri $cache_control {
  default "no-cache";
  # Archivos con hash de contenido que genera Angular (main-XXXX.js, styles-XXXX.css, chunk-XXXX.js)
  "~^/[A-Za-z0-9_.-]+-[A-Z0-9]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Un recurso estático que no existe es un 404, no el index.html de la SPA.
  location ~* \.(js|css|map|ico|png|jpg|svg|woff2?)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
