# Configuración del análisis automático de SonarCloud.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=src/environments/**

# Web:InputWithoutLabelCheck mira el HTML sin resolver los componentes: un <input appFieldControl>
# dentro de <app-form-field> recibe su id y su <label for> en ejecución (P-07, QP-UI), así que la
# regla da un falso positivo en cada campo del kit. Se excluye solo en las plantillas.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=src/app/**/*.html
